org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround: Kotlin incremental compiler (Build Tools API) crashes on Windows
# when the project drive differs from the Gradle/pub cache drive ("this and
# base files have different roots") while computing relative paths. Project
# ini di D:, cache Gradle/pub di C:. Nonaktifkan incremental compilation untuk
# menghindari crash tersebut.
kotlin.incremental=false
